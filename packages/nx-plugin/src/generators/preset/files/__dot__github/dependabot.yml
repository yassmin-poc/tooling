version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      exclude:
        - '@yassmin-poc/commitlint-config'
        - '@yassmin-poc/standards'
        - '@yassmin-poc/nx-plugin'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      exclude:
        - '*'
