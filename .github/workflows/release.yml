name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v7
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@yassmin-poc'
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm install && npx nx build nx-plugin
      - if: ${{ steps.release.outputs['packages/commitlint-config--release_created'] == 'true' }}
        run: npm publish
        working-directory: packages/commitlint-config
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.release.outputs['packages/standards--release_created'] == 'true' }}
        run: npm publish
        working-directory: packages/standards
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.release.outputs['packages/nx-plugin--release_created'] == 'true' }}
        run: npm publish
        working-directory: packages/nx-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
