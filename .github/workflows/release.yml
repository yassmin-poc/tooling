name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      plugin-released: ${{ steps.release.outputs['plugins/poc-tools--release_created'] }}
      plugin-tag: ${{ steps.release.outputs['plugins/poc-tools--tag_name'] }}
      any-released: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v7
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@yassmin-poc'
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm install && npx nx build nx-plugin
      - if: ${{ steps.release.outputs['packages/commitlint-config--release_created'] == 'true' }}
        run: npm publish
        working-directory: packages/commitlint-config
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.release.outputs['packages/standards--release_created'] == 'true' }}
        run: npm publish
        working-directory: packages/standards
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.release.outputs['packages/nx-plugin--release_created'] == 'true' }}
        run: npm publish
        working-directory: packages/nx-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  plugin-sync:
    needs: release
    if: ${{ needs.release.outputs.plugin-released == 'true' }}
    uses: ./.github/workflows/plugin-sync.yml
    with:
      tag: ${{ needs.release.outputs.plugin-tag }}
    secrets: inherit
  preset-sync:
    needs: release
    if: ${{ needs.release.outputs.any-released == 'true' }}
    uses: ./.github/workflows/preset-sync.yml
    secrets: inherit
