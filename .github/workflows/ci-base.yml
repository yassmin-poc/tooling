name: ci-base
on:
  workflow_call:
permissions:
  contents: read
  packages: read
env:
  STANDARDS_VERSION: 0.1.0
jobs:
  standards-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@yassmin-poc'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npx --yes "@yassmin-poc/standards@${STANDARDS_VERSION}" .
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
  commitlint:
    # Dependabot's messages ("Bump x from 1 to 2") are not Conventional Commits, so the job skips
    # them. Step 24 confirms that a skipped required check doesn't block the merge.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@yassmin-poc'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run:
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{
          github.event.pull_request.head.sha }}
