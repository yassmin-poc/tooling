name: preset-sync
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          FILE: packages/nx-plugin/src/generators/preset/pins.json
          BRANCH: chore/preset-pins
        run: |
          node scripts/preset-pins.mjs --write
          if git diff --quiet; then exit 0; fi
          title="fix(nx-plugin): pin the preset to the latest releases"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>/dev/null || true
          base=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base"
          sha=$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" --jq .sha)
          gh api -X PUT "repos/$REPO/contents/$FILE" -f message="$title" \
            -f content="$(base64 -w0 "$FILE")" -f sha="$sha" -f branch="$BRANCH"
          gh pr create -R "$REPO" --base main --head "$BRANCH" --title "$title" \
            --body "Moves the Nx preset's pins to the latest releases. Opened by preset-sync."
